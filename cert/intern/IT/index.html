<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Not Found</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080d18;
      --panel: rgba(17, 27, 47, .82);
      --text: #edf3ff;
      --muted: #94a3b8;
      --accent: #55d6be;
      --line: rgba(148, 163, 184, .18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(31, 111, 139, .22), transparent 38%),
        radial-gradient(ellipse at 85% 80%, rgba(79, 70, 229, .18), transparent 40%),
        var(--bg);
    }
    .card {
      width: min(100%, 680px); padding: clamp(28px, 6vw, 56px);
      text-align: center; border: 1px solid var(--line); border-radius: 24px;
      background: var(--panel); box-shadow: 0 24px 80px rgba(0,0,0,.38);
      backdrop-filter: blur(14px);
    }
    .icon {
      width: 76px; height: 76px; margin: 0 auto 24px; display: grid; place-items: center;
      border: 1px solid rgba(85,214,190,.35); border-radius: 22px;
      color: var(--accent); background: rgba(85,214,190,.08);
    }
    .icon svg { width: 38px; height: 38px; }
    .code { color: var(--accent); font-size: clamp(4rem, 13vw, 7rem); line-height: .95; font-weight: 800; letter-spacing: -.07em; }
    h1 { margin: 20px 0 12px; font-size: clamp(1.45rem, 4vw, 2rem); letter-spacing: -.03em; }
    p { margin: 0 auto; max-width: 480px; color: var(--muted); line-height: 1.7; }
    .rule { height: 1px; margin: 30px 0 22px; background: var(--line); }
    .status { display: inline-flex; align-items: center; gap: 9px; color: #b9c7d9; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .footer { margin-top: 26px; font-size: .78rem; color: #64748b; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/>
        <path d="M8 9h8M8 12h5M8 15h3"/>
        <path d="m17 13 3 3m0-3-3 3"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for may have been moved, removed, or is temporarily unavailable. Please check the address and try again.</p>
    <div class="rule"></div>
    <div class="status"><span class="dot"></span> Request handled</div>
    <div class="footer">If you believe this is an error, contact the website administrator.</div>
  </main>
</body>
</html>
